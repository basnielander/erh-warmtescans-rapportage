<div class="map-container">
  <div class="map-content">
    <!-- Loading State -->
    @if (isLoading()) {
      <div class="loading">
        <div class="spinner"></div>
        <p>Laden van kaart map...</p>
      </div>
    }

    <!-- Error State -->
    @if (error() && !isLoading()) {
      <div class="error">
        <p class="error-message">{{ error() }}</p>
        <button (click)="reload()" class="retry-button">Retry</button>
      </div>
    }

    <!-- Map Image -->
    @if (imageUrl() && !isLoading() && !error()) {
      <div class="map-image-wrapper">
        <img [src]="imageUrl()" [alt]="'Kaart van ' + address()" class="map-image" />
      </div>
    }
  </div>
</div>
